name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Tests + unsigned IPA artifact
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Run unit tests (iOS simulator)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme RenkoTrader \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath build \
            | xcbeautify --renderer github-actions

      - name: Build app for device (unsigned)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme RenkoTrader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify --renderer github-actions

      - name: Package unsigned IPA
        run: |
          APP="app/build/Build/Products/Release-iphoneos/RenkoTrader.app"
          test -d "$APP" || { echo "::error::RenkoTrader.app not found"; ls app/build/Build/Products/ || true; exit 1; }
          rm -rf Payload RenkoTrader.ipa
          mkdir Payload
          cp -R "$APP" Payload/RenkoTrader.app
          zip -qry RenkoTrader.ipa Payload
          ls -lh RenkoTrader.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenkoTrader-unsigned-ipa
          path: RenkoTrader.ipa
          retention-days: 30
