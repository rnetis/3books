name: RenkoTrader
options:
  bundleIdPrefix: com.renkotrader
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  RenkoTrader:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.renkotrader.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: RenkoScanner
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - com.renkotrader.scan
        ITSAppUsesNonExemptEncryption: false

  RenkoTraderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: RenkoTrader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.renkotrader.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RenkoTrader:
    build:
      targets:
        RenkoTrader: all
        RenkoTraderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RenkoTraderTests
    archive:
      config: Release
